---
layout: none
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KQNMJ2EVT6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date()); gtag('config', 'G-KQNMJ2EVT6');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Lora', serif;
            background: linear-gradient(135deg, #f1e1c9 0%, #e2d0ba 100%);
            min-height: 100vh;
            color: #3d2c13;
            margin-left: 220px;
            transition: margin-left 0.3s;
        }
        @media (max-width: 900px) { body { margin-left: 0; } }

        /* ── Sidebar ── */
        .sidebar {
            width: 200px; position: fixed; top: 0; left: 0;
            height: 100vh; overflow-y: auto;
            background: #f9f9f9;
            border-right: 1px solid #e0cda9;
            border-radius: 0 12px 12px 0;
            box-shadow: 2px 0 12px rgba(176,143,92,.10);
            padding: 18px 10px 10px;
            z-index: 1001;
            transition: transform 0.3s, opacity 0.3s;
        }
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
            body:not(.sidebar-collapsed) .sidebar { transform: translateX(0); opacity: 1; pointer-events: auto; }
        }
        .sidebar h2 { font-size: 1.1em; color: #b08f5c; margin-top: 55px; margin-bottom: 8px; font-family: 'Poppins', sans-serif; }
        .sidebar ul { list-style: none; }
        .sidebar a {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 14px; margin-bottom: 6px; border-radius: 10px;
            text-decoration: none; color: #333; font-size: 0.97em;
            transition: background 0.18s, color 0.18s;
        }
        .sidebar a:hover { background: #f5e7d2; color: #b08f5c; }
        .sidebar a.active { background: #b08f5c; color: #fff; font-weight: 600; }

        .nav-toggle {
            position: fixed; top: 16px; left: 16px;
            font-size: 1.5em; cursor: pointer;
            background: rgba(255,255,255,.85);
            border-radius: 50%; padding: 10px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            z-index: 1002; line-height: 1;
        }
        .nav-toggle:hover { background: #fff; }
        body.sidebar-collapsed { margin-left: 20px; }
        body.sidebar-collapsed .sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        @media (max-width: 900px) { body.sidebar-collapsed { margin-left: 0; } }

        /* ── Page layout ── */
        .page-wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 60px; }

        /* ── Header ── */
        .page-header { text-align: center; margin-bottom: 32px; }
        .page-header .brand { font-size: 0.85em; letter-spacing: 3px; text-transform: uppercase; color: #b08f5c; font-family: 'Poppins', sans-serif; margin-bottom: 6px; }
        .page-header h1 { font-family: 'Poppins', sans-serif; font-size: 2.3em; color: #3d2c13; font-weight: 700; line-height: 1.2; }
        .page-header p { color: #7a6040; font-size: 1.02em; margin-top: 10px; }

        /* ── Card ── */
        .card {
            background: rgba(255,255,255,.82);
            border: 1.5px solid #e0cda9;
            border-radius: 16px;
            padding: 32px 34px;
            margin-bottom: 22px;
            box-shadow: 0 4px 20px rgba(176,143,92,.10);
        }

        /* ── Prose styling for rendered markdown ── */
        .prose { font-size: 1.06em; line-height: 1.8; color: #4a3a22; }
        .prose > *:first-child { margin-top: 0; }

        .prose h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.4em; color: #3d2c13; font-weight: 700;
            margin: 36px 0 16px;
            padding-top: 24px;
            border-top: 1.5px solid #ecdcc0;
        }
        .prose > h2:first-child, .prose > *:first-child + h2 { border-top: none; padding-top: 0; margin-top: 0; }

        .prose h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.05em; color: #b08f5c; font-weight: 600;
            letter-spacing: 0.5px;
            margin: 22px 0 10px;
        }

        .prose p { margin: 14px 0; }

        .prose ul { list-style: none; margin: 14px 0; padding: 0; }
        .prose li {
            position: relative; padding-left: 26px; margin-bottom: 10px;
        }
        .prose li::before {
            content: ""; position: absolute; left: 6px; top: 0.62em;
            width: 8px; height: 8px; border-radius: 50%;
            background: #b08f5c;
        }
        .prose li strong { color: #3d2c13; }

        .prose img {
            display: block; margin: 22px auto;
            border-radius: 14px;
            box-shadow: 0 6px 22px rgba(176,143,92,.20);
            max-width: 100%; height: auto;
        }

        .prose blockquote {
            margin: 20px 0;
            padding: 20px 24px;
            background: #fef9f2;
            border-left: 4px solid #b08f5c;
            border-radius: 10px;
            font-style: italic;
            color: #5c4020;
        }
        .prose blockquote p { margin: 4px 0; }

        .prose a { color: #96773d; text-decoration: underline; text-underline-offset: 2px; }
        .prose a:hover { color: #b08f5c; }

        /* ── Buttons (markdown {: .button }) ── */
        .prose a.button {
            display: inline-block; margin: 8px 10px 8px 0;
            padding: 13px 26px;
            font-family: 'Poppins', sans-serif; font-weight: 700;
            font-size: 0.95em; letter-spacing: 0.5px;
            background: #b08f5c; color: #fff;
            border-radius: 10px; text-decoration: none;
            box-shadow: 0 4px 14px rgba(176,143,92,.28);
            transition: background 0.2s, transform 0.1s;
        }
        .prose a.button:hover { background: #96773d; color: #fff; }
        .prose a.button:active { transform: scale(0.97); }
        .prose a.button.secondary { background: #fffdf8; color: #96773d; border: 1.5px solid #d4b896; box-shadow: 0 2px 10px rgba(176,143,92,.12); }
        .prose a.button.secondary:hover { background: #f5e7d2; color: #96773d; }

        .social-row { margin: 16px 0; display: flex; gap: 12px; align-items: center; }
        .social-row img { box-shadow: none !important; border-radius: 0 !important; margin: 0 !important; }

        @media (max-width: 600px) {
            .card { padding: 22px 18px; }
            .page-header h1 { font-size: 1.85em; }
        }
    </style>
</head>
<body>

<div class="nav-toggle" id="navToggle">&#9776;</div>

<div class="sidebar" id="sidebar">
    <h2>Navigation</h2>
    <ul>
        <li><a href="/2025/03/20/kairali-coconut-milk-oil.html" class="{% if page.url == '/2025/03/20/kairali-coconut-milk-oil.html' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 22 22" fill="none"><path d="M11 2C11.552 2 12 2.448 12 3V8.5C12 8.776 12.224 9 12.5 9C14.985 9 17 11.015 17 13.5C17 16.537 14.314 19 11 19C7.686 19 5 16.537 5 13.5C5 11.015 7.015 9 9.5 9C9.776 9 10 8.776 10 8.5V3C10 2.448 10.448 2 11 2Z" fill="#b08f5c"/><ellipse cx="11" cy="14.5" rx="3.5" ry="3" fill="#fffbe7"/></svg>
            Kairali Oil
        </a></li>
        <li><a href="/2025/03/20/benefits.html" class="{% if page.url == '/2025/03/20/benefits.html' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><polygon points="10,2 12.5,7.5 18,8 13.5,12 14.5,18 10,15 5.5,18 6.5,12 2,8 7.5,7.5" fill="#b08f5c"/></svg>
            Benefits
        </a></li>
        <li><a href="/kairali-delivery/" class="{% if page.url == '/kairali-delivery/' %}active{% endif %}">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="7" width="16" height="10" rx="2" stroke="#b08f5c" stroke-width="1.5" fill="none"/><path d="M6 7V5a4 4 0 018 0v2" stroke="#b08f5c" stroke-width="1.5" fill="none"/><circle cx="10" cy="12" r="1.5" fill="#b08f5c"/></svg>
            Order Calculator
        </a></li>
    </ul>
</div>

<div class="page-wrap">

    <div class="page-header">
        <div class="brand">VKP Industries &bull; Since 1990</div>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    </div>

    <div class="card">
        <div class="prose">
            {{ content }}
        </div>
    </div>

</div>

<script>
document.getElementById('navToggle').addEventListener('click', () => {
    document.body.classList.toggle('sidebar-collapsed');
});
window.addEventListener('resize', () => {
    if (window.innerWidth > 900) document.body.classList.remove('sidebar-collapsed');
});
</script>
</body>
</html>
