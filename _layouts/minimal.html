/* The sidebar code should be grouped into the existing style block for consistency and maintainability. */
.sidebar {
  width: 200px;
  float: left;
  margin-right: 20px;
  padding: 18px 10px 10px 10px;
  border: 1px solid #e0cda9;
  height: 100vh;
  position: fixed;
  top: 0;
  left: 0;
  overflow-y: auto;
  background-color: #f9f9f9;
  transition: transform 0.3s ease-in-out, opacity 0.3s;
  z-index: 1001;
  border-radius: 18px;
  box-shadow: 0 4px 24px rgba(176,143,92,0.10);
}
@media (max-width: 900px) {
  .sidebar {
    width: 80vw;
    max-width: 320px;
    min-width: 180px;
    margin-right: 0;
    background: rgba(249, 249, 249, 0.98);
    box-shadow: 2px 0 16px rgba(0,0,0,0.08);
    border-right: 1px solid #e0cda9;
    border-radius: 0 12px 12px 0;
    /* Start hidden off-screen */
    transform: translateX(-100%);
    opacity: 0;
    pointer-events: none;
  }
  .sidebar:not(.hide) {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  body.sidebar-collapsed .sidebar {
    transform: translateX(-100%);
    opacity: 0;
    pointer-events: none;
  }
  body:not(.sidebar-collapsed) .sidebar {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }
  .hero-bg, .container {
    margin-left: 0 !important;
  }
}

.sidebar h2 {
  font-size: 1.2em;
  margin-bottom: 10px;
  margin-top: 60px;
}
@media (max-width: 600px) {
  .sidebar h2 {
    margin-top: 70px;
  }
}

.sidebar ul {
  list-style: none;
  padding: 0;
  margin-top: 18px;
}

.sidebar li {
  margin-bottom: 5px;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  margin-bottom: 8px;
  border-radius: 12px;
  text-decoration: none;
  color: #333;
  background: transparent;
  transition: background 0.18s, color 0.18s, box-shadow 0.18s;
  box-shadow: 0 1px 4px rgba(176,143,92,0.04);
  font-size: 1.08em;
}

.sidebar a:hover {
  background-color: #f5e7d2;
  color: #b08f5c;
  box-shadow: 0 2px 8px rgba(176,143,92,0.08);
}

.sidebar a.active {
  background-color: #b08f5c;
  color: white;
  font-weight: bold;
  box-shadow: 0 4px 12px rgba(176,143,92,0.14);
}

/* Adjust the body to accommodate the fixed sidebar */
body {
    margin-left: 220px; /* Width of the sidebar + margin */
    transition: margin-left 0.3s ease-in-out; /* Add transition for smooth toggle */
}
@media (max-width: 900px) {
  body {
    margin-left: 0 !important;
  }
}

/* Ensure the container doesn't negate the body's margin */
.container {
    max-width: 1200px;
    margin: 20px auto;
    background: #fff;
    padding: 15px;
    border-radius: 4px;
    border: 1px solid #e0cda9;
    margin-left: auto; /* Override any inherited margin-left */
    margin-right: auto; /* Keep it centered */
}

/* Style for the navigation toggle */
.nav-toggle {
  font-size: 1.7em;
  cursor: pointer;
  padding: 12px 18px;
  position: fixed;
  top: 18px;
  left: 18px;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  z-index: 1002;
  transition: background 0.2s;
}
.nav-toggle:hover {
  background: rgba(255,255,255,1);
}
@media (max-width: 600px) {
  .nav-toggle {
    top: 8px;
    left: 8px;
    font-size: 1.3em;
    padding: 8px 12px;
  }
}

/* Hide the sidebar */
.sidebar.hide {
  transform: translateX(-220px); /* Hide the sidebar off-screen */
}

body.hide {
  margin-left: 20px; /* Restore the body margin when sidebar is hidden */
}
body.sidebar-collapsed {
  margin-left: 20px !important;
}
@media (max-width: 768px) {
  body.sidebar-collapsed {
    margin-left: 0 !important;
  }
}


/* Media query for smaller screens */
@media (max-width: 768px) {
  .nav-toggle {
    display: block; /* Show the toggle on smaller screens */
  }
  .sidebar {
    transition: transform 0.3s ease-in-out;
  }

  body {
    margin-left: 20px; /* remove body magin */
  }

  .sidebar.hide {
    transform: translateX(0); /* Restore the sidebar position when toggled */
  }

}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navToggle = document.querySelector('.nav-toggle');
            const sidebar = document.querySelector('.sidebar');
            const body = document.querySelector('body');

            navToggle.addEventListener('click', function() {
                sidebar.classList.toggle('hide');
                document.body.classList.toggle('sidebar-collapsed');
            });
            // Ensure sidebar is always accessible when resizing
            window.addEventListener('resize', function() {
                if(window.innerWidth > 768) {
                    sidebar.classList.remove('hide');
                    document.body.classList.remove('sidebar-collapsed');
                }
            });
        });
    </script>
