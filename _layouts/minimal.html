layout: none

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
            background: linear-gradient(to bottom, #f1e1c9, #e2d0ba);
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #e0cda9;
        }
        h1 {
            color: #b08f5c;
            font-size: 2em;
            margin-bottom: 10px;
        }
        p, li {
            color: #555;
            font-size: 1em;
        }
        ul {
            margin-bottom: 20px;
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ page.title }}</h1>
        <p>{{ content }}</p>
    </div>
</body>
</html>
